# Builds the Android app and publishes it as the "apk-latest" release, so the
# newest APK is always at https://github.com/<owner>/SYL/releases/tag/apk-latest
name: Android APK

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk syl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: syl-apk
          path: mobile/syl.apk

      - name: Publish as the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest syl.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "SYL app (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. On your phone: download syl.apk, open it, and allow installing from this source if asked."
