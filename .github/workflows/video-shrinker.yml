# Builds the Video Shrinker Windows app (tools/video_shrinker) and publishes it as
# the "video-shrinker-latest" release: a zip with VideoShrinker.exe + ffmpeg.
name: Video Shrinker (Windows)

on:
  push:
    paths:
      - "tools/video_shrinker/**"
      - ".github/workflows/video-shrinker.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-shrinker
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: tools/video_shrinker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download ffmpeg
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          $bin = Get-ChildItem ffmpeg-src -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName, (Join-Path $bin.DirectoryName ffprobe.exe) .
          .\ffmpeg.exe -version | Select-Object -First 1

      - name: Test
        run: python -m unittest -v test_shrink_core

      - name: Build exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name VideoShrinker video_shrinker.py

      - name: Package
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist\VideoShrinker.exe, ffmpeg.exe, ffprobe.exe, README.md pkg\
          Compress-Archive pkg\* VideoShrinker-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VideoShrinker-windows
          path: tools/video_shrinker/VideoShrinker-windows.zip

      - name: Publish as the video-shrinker-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete video-shrinker-latest --yes --cleanup-tag 2>$null
          gh release create video-shrinker-latest VideoShrinker-windows.zip `
            --prerelease `
            --target "$env:GITHUB_SHA" `
            --title "Video Shrinker (latest build)" `
            --notes "Windows app that shrinks videos to 720p/480p. Download VideoShrinker-windows.zip, unzip, run VideoShrinker.exe (ffmpeg included). Built from $env:GITHUB_REF_NAME."
